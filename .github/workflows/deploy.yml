# Builds the app and publishes it to GitHub Pages on every push to main.
#
# One-time setup in the repository:
#   Settings → Pages → Source: GitHub Actions
#   Settings → Secrets and variables → Actions → New repository secret:
#     SUPABASE_URL       your project URL
#     SUPABASE_ANON_KEY  the anon / publishable key
#
# The anon key is public by design — it ships in the built JavaScript either
# way. Row-level security is what protects the data, not the secrecy of this
# key. It lives in Actions secrets so it is not committed to a public repo.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race each other.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Cycle maths under three timezones, money handling, ordering, and the
      # monochrome check. A red test never reaches the live site.
      - run: npm test

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
